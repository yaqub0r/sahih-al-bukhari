name: Publish reviewed public-working distribution
on:
  workflow_dispatch:
    inputs:
      repository_commit:
        description: Full reviewed main commit (40 lowercase hex characters)
        required: true
        type: string
      proposal_path:
        description: Approved tracked release/proposals/<release-id>.json
        required: true
        type: string
      archive_sha256:
        description: Exact locally reviewed ZIP SHA-256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-distribution
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    permissions:
      contents: write
      checks: read
    steps:
      - name: Check out the requested reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.repository_commit }}
      - name: Validate and publish only the exact approved archive
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.repository_commit }}
          REVIEWED_PROPOSAL: ${{ inputs.proposal_path }}
          REVIEWED_SHA256: ${{ inputs.archive_sha256 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          python3 -m unittest discover -s tests -v
          python3 scripts/publish_distribution.py --commit "$REVIEWED_COMMIT" --proposal "$REVIEWED_PROPOSAL" --expected-sha256 "$REVIEWED_SHA256"
